<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>{{ story.title }}</title>
    <style>
        body { background: #fdf6e3; line-height: 1.8; padding: 20px; font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif; }
        .content-box { max-width: 800px; margin: auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 10px; }
        .author { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-style: italic; }
        .text { font-size: 20px; color: #2d3436; white-space: pre-wrap; text-align: justify; }
        .back-link { margin-bottom: 30px; display: inline-block; text-decoration: none; color: #3498db; font-weight: bold; }
        .back-link:hover { color: #2980b9; text-decoration: underline; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="content-box">
        <a href="/" class="back-link">← Quay lại thư viện</a>
        <h1>{{ story.title }}</h1>
        <div class="author">Tác giả: {{ story.author }}</div>
        <hr>
        <div class="text">{{ story.content }}</div>
    </div>
</body>
</html>
