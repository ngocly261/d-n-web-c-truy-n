<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Truyện Mới</title>
    <style>
        body { font-family: Arial; background: #f4f7f6; padding: 40px; }
        .form-box { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        textarea { height: 200px; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .back { display: block; margin-bottom: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-box">
        <a href="/" class="back">← Quay lại trang chủ</a>
        <h2>Đăng Truyện Mới</h2>
        <form method="POST">
            <input type="text" name="title" placeholder="Tên truyện" required>
            <input type="text" name="author" placeholder="Tác giả" required>
            <input type="text" name="summary" placeholder="Tóm tắt ngắn" required>
            <textarea name="content" placeholder="Nội dung chi tiết của truyện..." required></textarea>
            <button type="submit">Đăng truyện ngay</button>
        </form>
    </div>
</body>
</html>
